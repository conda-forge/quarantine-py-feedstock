schema_version: 1

context:
  version: "1.2.0"

package:
  name: quarantine-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/quarantine-py/quarantine_py-${{ version }}.tar.gz
  sha256: 027ef09d81bf913c06e8206da42d9b09cbf2e03891e75691c244d8111c13cb4b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - quarantine = quarantine.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.24
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - quarantine
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - quarantine --help

about:
  summary: When one bad item crashes your loop of 10,000 - don't crash. Set it aside, keep going, fix it later.
  license: MIT
  license_file: LICENSE
  homepage: https://quarantine-py.aritro.cloud
  repository: https://github.com/halcyon-past/quarantine
  documentation: https://quarantine-py.aritro.cloud

extra:
  recipe-maintainers:
    - halcyon-past
